descripcio:
  es: >-
    Entre 2014 y 2016 recorrió una y otra vez, con su hermano Tadeo, la rambla de Celumbres, entre
    Cinctorres, Castellfort y Portell de Morella, identificando y describiendo lo que encontraban:
    el paraje y las cuatro estaciones, los árboles, las orquídeas y las flores silvestres, las
    mariposas y las polillas, las aves rapaces y la cabra montés, los hongos y los líquenes. Ella
    escribía y él fotografiaba. Lo publicaron en un blog que hoy es una guía de veintitrés
    capítulos, con los textos corregidos y traducidos al valenciano, al inglés y al chino.
  ca: >-
    Entre 2014 i 2016 va recórrer una vegada i una altra, amb el seu germà Tadeo, la rambla de
    Celumbres, entre Cinctorres, Castellfort i Portell de Morella, identificant i descrivint el que
    hi trobaven: el paratge i les quatre estacions, els arbres, les orquídies i les flors
    silvestres, les papallones i les arnes, les aus rapinyaires i la cabra salvatge, els fongs i els
    líquens. Ella escrivia i ell fotografiava. Ho van publicar en un blog que hui és una guia de
    vint-i-tres capítols, amb els textos corregits i traduïts al valencià, a l'anglés i al xinés.
